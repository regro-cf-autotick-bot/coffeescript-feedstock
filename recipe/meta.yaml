{% set name = "coffeescript" %}
{% set version = "2.7.1" %}
{% set sha256 = "de2a138f826d2403f45eb3d2772b2390b537496eecb7a26615aea39aa117d7fd" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/jashkenas/{{ name }}/archive/{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  number: 0
  noarch: generic
  script: |
    tgz=$(npm pack)
    npm install -g $tgz

requirements:
  build:
    - nodejs

test:
  commands:
    - npm list -g coffeescript
  requires:
    - nodejs

about:
  home: https://github.com/jashkenas/coffeescript
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: 'Unfancy JavaScript'
  description: |
    CoffeeScript is a little language that compiles into JavaScript. 
  doc_url: http://coffeescript.org/
  dev_url: https://github.com/jashkenas/coffeescript

extra:
  recipe-maintainers: []
